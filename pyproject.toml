[project]
name = "finsent"
version = "0.2.0"
description = "Financial-news sentiment: lexicon vs classic ML vs transformers, evaluated on one held-out set"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "click>=8.1",
    "nltk>=3.8",
    "finvader>=1.0",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "numpy>=1.26",
]

[project.optional-dependencies]
transformers = ["torch>=2.3", "transformers>=4.44,<5"]
app = ["streamlit>=1.38"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
finsent = "finsent.cli:main"

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/finsent"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["legacy"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
